server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Reverse-Proxy fürs Backend --------------------------------------
    # Leitet /api/-Anfragen im Container-Netzwerk an den FastAPI-Service
    # weiter ("backend" ist der Service-Name aus docker-compose.yml). Da
    # Browser-Requests dadurch denselben Origin (http://localhost:8080)
    # sehen wie die ausgelieferte SPA, entstehen keine CORS-Anfragen mehr.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF-Downloads/-Vorschauen können mehrere MB groß sein.
        client_max_body_size 20m;

        # War zuvor 120s - exakt derselbe Wert wie das Backend-eigene
        # OLLAMA_TIMEOUT_SECONDS (siehe backend/app/core/config.py), was zu
        # einem Wettlauf führte: nginx startet seine Uhr, sobald der Request
        # proxied wird, das Backend startet seine eigene 120s-Uhr für den
        # Ollama-Aufruf aber erst NACH PDF-Parsing/FastAPI-Overhead - nginx'
        # Timeout feuerte damit fast immer zuerst und lieferte ein generisches
        # 504 statt der aussagekräftigen Backend-Fehlermeldung (siehe
        # ce-debug-Untersuchung, 2026-08-18). `proxy_read_timeout` misst die
        # Idle-Zeit zwischen zwei Lese-Ereignissen vom Upstream - da das
        # Backend während der gesamten Ollama-Verarbeitung nichts zurücksendet,
        # wirkt das faktisch wie ein Gesamt-Timeout. Backend-Worst-Case: bis zu
        # drei sequentielle Ollama-Aufrufe à 300s (Erstversuch + Retry +
        # Abflach-Fallback) = 900s, plus PDF-Parsing-Overhead - 900s hier wäre
        # also wieder ein exakter Gleichstand und würde denselben Wettlauf
        # reproduzieren. 1000s gibt echten Sicherheitsabstand.
        proxy_read_timeout 1000s;
    }

    # --- Statische Assets aggressiv cachen --------------------------------
    # Angular versieht Dateinamen mit Content-Hashes, daher ist langes
    # Caching hier gefahrlos.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --- Angular-SPA: Client-Side-Routing-Fallback ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
