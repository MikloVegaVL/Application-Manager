<h2 mat-dialog-title>Auto-fill portal</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="dialog-form__field">
      <mat-label>Application form URL</mat-label>
      <input matInput type="url" formControlName="url" placeholder="https://..." />
    </mat-form-field>

    <mat-checkbox formControlName="dryRun">Dry run (fill without submitting)</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onConfirm()">
    Auto-fill portal
  </button>
</mat-dialog-actions>
