<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Application Manager Autofill - Settings</title>
    <style>
      body {
        font: 14px system-ui, sans-serif;
        margin: 24px;
        max-width: 520px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 8px 14px;
      }
      #status {
        margin-left: 12px;
      }
      .hint {
        color: #555;
        margin-top: 4px;
      }
      .tos {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 20px;
        font-weight: 400;
      }
      .tos input {
        width: auto;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Application Manager Autofill</h1>
    <p class="hint">
      Paste the fill secret from the app's settings once. It is stored only in
      this browser profile and never synced. On the host the secret is written
      to <code>backend/generated/portal_fill_secret</code> (in Docker:
      <code>/app/generated/portal_fill_secret</code>).
    </p>
    <form id="options-form">
      <label for="api-base-url">App API base URL</label>
      <input id="api-base-url" type="url" placeholder="http://localhost:8000/api" />
      <label for="secret">Fill secret</label>
      <input id="secret" type="password" autocomplete="off" spellcheck="false" />
      <label class="tos" for="tos-ack">
        <input id="tos-ack" type="checkbox" />
        <span>
          I understand that LinkedIn's User Agreement prohibits browser
          extensions that automate activity on LinkedIn, and that using this
          extension to fill Easy Apply may result in my LinkedIn account being
          restricted. I accept this risk.
        </span>
      </label>
      <div>
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
