[alembic]
# `%(here)s` (von Alembic automatisch auf das Verzeichnis dieser alembic.ini
# gesetzt) statt eines bloßen relativen Pfads - ein bloßes `script_location =
# alembic` löst Alembic gegen das *aktuelle Arbeitsverzeichnis des Prozesses*
# auf, nicht gegen den Ordner dieser Datei (Alembic-Eigenheit, per Review
# reproduziert: `alembic upgrade head` schlägt fehl, sobald uvicorn/pytest
# aus einem anderen Verzeichnis als backend/ gestartet wird). `%(here)s`
# macht das unabhängig vom Arbeitsverzeichnis.
script_location = %(here)s/alembic

# Timezone-aware Zeitstempel im Dateinamen jeder Revision.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
