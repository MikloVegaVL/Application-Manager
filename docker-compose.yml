services:
  # --- PostgreSQL-Datenbank -------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-application_manager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Nur für lokalen Zugriff per DB-Client (z. B. psql/TablePlus) von
      # außerhalb des Docker-Netzwerks - für den Backend-Container selbst
      # nicht nötig, der spricht intern mit dem Hostnamen "db".
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-application_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Ollama (lokales LLM-Runtime) ------------------------------------------
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      # Eigenes, kleineres Modell nur für die CV-Analyse (siehe
      # backend/app/core/config.py: OLLAMA_MODEL_CV_PARSING und die
      # ce-debug-Untersuchung, 2026-08-18) - muss hier separat gepullt werden,
      # sonst schlägt jede CV-Analyse auf einem frischen Deployment mit
      # "model not found" fehl, weil nur OLLAMA_MODEL automatisch gezogen wird.
      OLLAMA_MODEL_CV_PARSING: ${OLLAMA_MODEL_CV_PARSING:-qwen2.5:3b-instruct}
    volumes:
      - ollama_data:/root/.ollama
      # Startup-Wrapper: zieht die konfigurierten Modelle beim Start, bevor der
      # Healthcheck "healthy" meldet. Wird eingebunden statt in ein eigenes
      # Image gebacken, da für diesen Service kein Dockerfile existiert.
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # Kein Host-Port: die Ollama-HTTP-API hat keine Authentifizierung und
    # bleibt deshalb nur intern im Docker-Netzwerk für "backend" erreichbar.
    healthcheck:
      # Kein curl im Base-Image vorhanden - stattdessen die ollama-CLI nutzen
      # und prüfen, ob BEIDE konfigurierten Modelle bereits gepullt wurden.
      test: ["CMD-SHELL", "ollama list | grep -q \"$$OLLAMA_MODEL\" && ollama list | grep -q \"$$OLLAMA_MODEL_CV_PARSING\" || exit 1"]
      # Großzügig bemessen für den (evtl. mehrere GB großen) Erstpull beider
      # Modelle - db's Postgres-Timing (~50s) reicht dafür nicht aus.
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 900s
    restart: unless-stopped

  # --- FastAPI-Backend -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Übernimmt OLLAMA_*, SMTP-Zugangsdaten etc. aus backend/.env
    # (siehe backend/.env.example -> vor dem ersten Start nach backend/.env kopieren).
    # DATABASE_URL wird hier bewusst überschrieben, damit gegen den
    # PostgreSQL-Container statt der lokalen SQLite-Datei verbunden wird.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-application_manager}
    volumes:
      # Persistiert generierte Bewerbungs-PDFs über Container-Neustarts hinweg.
      - ./backend/generated:/app/generated
    ports:
      - "8000:8000"
      # Chromium-Remote-Debugging (R3/KTD3/KTD8, für eine Captcha-Pause) - NUR
      # auf 127.0.0.1 gemappt, nicht auf allen Host-Interfaces: die
      # ungebundene Kurzsyntax ("9222:9222") würde den Port auf 0.0.0.0
      # veröffentlichen und damit jedem im selben Netzwerk volle,
      # unauthentifizierte Kontrolle über den Automations-Browser geben,
      # statt nur "der eigenen Maschine" wie in R3 vorausgesetzt.
      #
      # ACHTUNG (Reviewer-Fund, correctness/adversarial): dieser Literal
      # MUSS manuell mit backend/.env(.example)s PORTAL_FILL_DEBUG_PORT und
      # applications.component.ts' `PORTAL_FILL_DEBUG_PORT`-Konstante
      # synchron gehalten werden - `${PORTAL_FILL_DEBUG_PORT}` würde hier
      # NICHT funktionieren, da Compose-Variablensubstitution die WURZEL-
      # `.env` liest (POSTGRES_USER etc.), nicht backend/.env (das nur per
      # `env_file:` in den Container geladen wird). Ändert sich der Wert nur
      # in backend/.env, bleibt dieses Mapping stumm auf dem alten Port -
      # keine Fehlermeldung, die Live-Ansicht zeigt einfach nichts mehr an.
      - "127.0.0.1:9222:9222"
    restart: unless-stopped

  # --- Angular-Frontend (Nginx) ----------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
