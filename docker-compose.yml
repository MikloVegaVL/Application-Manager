services:
  # --- PostgreSQL-Datenbank -------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-application_manager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Nur für lokalen Zugriff per DB-Client (z. B. psql/TablePlus) von
      # außerhalb des Docker-Netzwerks - für den Backend-Container selbst
      # nicht nötig, der spricht intern mit dem Hostnamen "db".
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-application_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Ollama (lokales LLM-Runtime) ------------------------------------------
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ollama_data:/root/.ollama
      # Startup-Wrapper: zieht das konfigurierte Modell beim Start, bevor der
      # Healthcheck "healthy" meldet. Wird eingebunden statt in ein eigenes
      # Image gebacken, da für diesen Service kein Dockerfile existiert.
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # Kein Host-Port: die Ollama-HTTP-API hat keine Authentifizierung und
    # bleibt deshalb nur intern im Docker-Netzwerk für "backend" erreichbar.
    healthcheck:
      # Kein curl im Base-Image vorhanden - stattdessen die ollama-CLI nutzen
      # und prüfen, ob das konfigurierte Modell bereits gepullt wurde.
      test: ["CMD-SHELL", "ollama list | grep -q \"$$OLLAMA_MODEL\" || exit 1"]
      # Großzügig bemessen für den (evtl. mehrere GB großen) Erstpull des
      # Modells - db's Postgres-Timing (~50s) reicht dafür nicht aus.
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 600s
    restart: unless-stopped

  # --- FastAPI-Backend -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Übernimmt OLLAMA_*, SMTP-Zugangsdaten etc. aus backend/.env
    # (siehe backend/.env.example -> vor dem ersten Start nach backend/.env kopieren).
    # DATABASE_URL wird hier bewusst überschrieben, damit gegen den
    # PostgreSQL-Container statt der lokalen SQLite-Datei verbunden wird.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-application_manager}
    volumes:
      # Persistiert generierte Bewerbungs-PDFs über Container-Neustarts hinweg.
      - ./backend/generated:/app/generated
    ports:
      - "8000:8000"
    restart: unless-stopped

  # --- Angular-Frontend (Nginx) ----------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
